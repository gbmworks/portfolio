<!-- Every path here is root-absolute, and that is the whole point of
     this file being written by hand rather than sharing js/boot.js.

     GitHub Pages serves 404.html for *any* missing path, and a relative
     href resolves against the URL that was requested — so on
     /some/deep/path the old "./css/style.css" asked for
     /some/deep/css/style.css and the page rendered unstyled.  It also
     means this page cannot load ./js/boot.js, so it carries the one
     stylesheet it needs and no scripts at all. -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/assets/1x/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/base.css" />
</head>

</body>
