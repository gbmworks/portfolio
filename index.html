<!DOCTYPE html>
<html lang="en" data-stage="hero">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- What has to be static: crawlers and social scrapers do not run
     scripts, so the title, description, canonical link and the card
     block stay here.  Everything else a page needs is in js/boot.js. -->
<title>Govind B Mohan — 3D Generalist, Industrial Designer &amp; Artist</title>
<meta name="description" content="Portfolio of Govind B Mohan: industrial design, character technical art and realtime visuals. Three worlds, one wheel." />
<link rel="canonical" href="https://www.govindbmohan.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Govind B Mohan" />
<meta property="og:title" content="Govind B Mohan — 3D Generalist, Industrial Designer &amp; Artist" />
<meta property="og:description" content="Portfolio of Govind B Mohan: industrial design, character technical art and realtime visuals. Three worlds, one wheel." />
<meta property="og:url" content="https://www.govindbmohan.com/" />
<meta property="og:image" content="https://www.govindbmohan.com/assets/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Govind B Mohan — 3D Generalist, Industrial Designer &amp; Artist" />
<meta name="twitter:description" content="Portfolio of Govind B Mohan: industrial design, character technical art and realtime visuals. Three worlds, one wheel." />
<meta name="twitter:image" content="https://www.govindbmohan.com/assets/og.jpg" />

<!-- Found by the preload scanner while the HTML is still parsing.

     These were injected by js/boot.js, which meant the browser knew
     about no stylesheet at all until boot.js had been fetched, parsed
     and run: a whole round trip of dead time before the first CSS
     request, and the Google Fonts hop stacked in series behind it.

     Yes, this is copied into all five shells. That is the point — the
     preload scanner only reads markup, so this is the one kind of
     duplication that has to stay duplicated. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" />
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/landing.css" />
<link rel="stylesheet" href="./css/sections.css" />
<link rel="stylesheet" href="./css/about.css" />
<link rel="stylesheet" href="./css/tiles.css" />
<link rel="stylesheet" href="./css/project.css" />
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js" crossorigin />

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<!-- fonts, stylesheets, icons, module preloads and the boot guard;
     must follow the import map -->
<script src="./js/boot.js"></script>
</head>
<body>

  <canvas id="stage"></canvas>
  <div class="scrim"></div>
  <div id="veil" class="veil"></div>

  <!-- filled from the <noscript> below if the app never comes up -->
  <div id="boot" class="fallback"></div>

  <!-- ============ INTRO (3s) ============ -->
  <div id="intro" class="intro">
    <div class="intro__inner">
      <h1 class="intro__name" data-stagger>GOVIND</h1>
      <p class="intro__roles" data-stagger>
        <span>3D Generalist</span><i>/</i><span>Industrial Designer</span><i>/</i><span>Artist</span>
      </p>
      <p class="intro__tag" data-stagger>aspiring creative technologist</p>
      <div class="intro__bar"><span id="introBar"></span></div>
    </div>
  </div>

  <!-- ============ SELECTION UI ============
       the top bar is prepended here by js/shell.js -->
  <div id="ui" class="ui">

    <!-- left column sits on the first third; the wheel on the golden section -->
    <div class="lede">
      <h1 class="lede__h">Form,<br>function,<br>and aesthetic.</h1>
      <p class="lede__p">
        Industrial design, character technical art and realtime visuals —
        three worlds, one wheel. Pick a slice.
      </p>
      <footer class="hint">
        <span class="hint__dot"></span>
        <span id="hintText">Hover a slice · the world changes</span>
      </footer>
    </div>

    <!-- projected onto the 3D slices every frame -->
    <div id="labels" class="labels"></div>

    <div id="hub" class="hub">
      <span class="hub__k">SELECT</span>
      <span class="hub__v" id="hubValue">A SECTOR</span>
    </div>
  </div>

  <!-- ============ THE REEL ============
       Selected work, one screen down.  The wheel above is fixed, so
       this scrolls up over a world that stays put.  Built by
       js/reel.js from FEATURED in js/projects.js. -->
  <section id="reel" class="reel" aria-label="Selected work"></section>

  <!-- ============ THE GROUND ============
       The other end of the top bar — the card, and the way out to where
       the work is published.  Built by mountGround() in js/shell.js. -->
  <footer id="ground" class="ground"></footer>

  <!-- The fallback, for no JavaScript and for a stall alike: js/boot.js
       copies this markup into #boot if the app has not signalled ready
       within seven seconds. -->
  <noscript class="fallback">
    <div class="fallback__inner">
      <h1>Govind B Mohan</h1>
      <p>3D Generalist · Industrial Designer · Artist</p>
      <p class="fallback__note">The interactive view needs WebGL and a moment to load. Here is the work:</p>
      <ul>
        <li><a href="industrial-design.html">Industrial Design</a></li>
        <li><a href="technical-art.html">Technical Art</a></li>
        <li><a href="visualization.html">Visualization</a></li>
      </ul>
      <p class="fallback__note"><a href="https://www.behance.net/govindbm">Behance</a> · <a href="https://www.instagram.com/vindgo.visual/">Instagram</a></p>
    </div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
