<!-- Found by the preload scanner while the HTML is still parsing.

     These were injected by js/boot.js, which meant the browser knew
     about no stylesheet at all until boot.js had been fetched, parsed
     and run: a whole round trip of dead time before the first CSS
     request.

     Every file named here is now on this origin — the faces and
     three.js both used to come from somewhere else, which cost two DNS
     lookups and two TLS handshakes that no preload scanner can skip.
     The two woff2 files are preloaded by hand because they are found
     one level deeper than the scanner reaches: it sees fonts.css, not
     the faces inside it, and these two carry the first text painted.

     Yes, this is copied into all five shells. That is the point — the
     preload scanner only reads markup, so this is the one kind of
     duplication that has to stay duplicated. -->
<link rel="preload" href="./assets/fonts/stack-sans-notch-400-700-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./assets/fonts/space-grotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin />
